name: AIRS Harness package contracts
on:
  push:
    branches: [main, integrate/codex-0.154-candidate]
    paths: ['npm/airs-harness/**', 'scripts/**', '.forgejo/workflows/**', 'codex-rs/skills/src/assets/samples/prisma-airs-asr-judge/**']
  pull_request:
    paths: ['npm/airs-harness/**', 'scripts/**', '.forgejo/workflows/**', 'codex-rs/skills/src/assets/samples/prisma-airs-asr-judge/**']
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu@sha256:4f2d5083a9d10d018c1c511eb8665cd480553c11975e78fd903a46daa830768b
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test npm/airs-harness/*.test.js
      - run: python3 -m unittest discover -s scripts -p test_airs_npm_registry.py -v
      - run: python3 -m unittest discover -s scripts -p test_package_airs_harness.py -v
      - name: Stable staging and promotion contracts
        run: |
          for pattern in 'test_airs_test_release*.py' test_promote_airs_stable.py test_validate_airs_test_registry_install.py; do
            python3 -m unittest discover -s scripts -p "$pattern" -v
          done
