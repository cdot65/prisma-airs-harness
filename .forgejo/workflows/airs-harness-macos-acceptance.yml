name: AIRS Harness Apple Silicon npm upgrade acceptance
on:
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: airs-macos-arm64
    timeout-minutes: 45
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test combined npm tarballs, upgrades, native storage and live MCP
        shell: bash
        run: bash scripts/airs_forgejo_mcp_npm.sh
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always()
        with:
          name: airs-mcp-npm-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/airs-mcp-npm/evidence/*.json
            ${{ runner.temp }}/airs-mcp-npm/evidence/installed-tests.log
            ${{ runner.temp }}/airs-mcp-npm/candidate-npm/NPM-PACKAGES.json
