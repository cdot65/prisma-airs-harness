name: AIRS Harness signed package E2E
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact compiled runtime commit
        required: true
      archive_sha256:
        description: Verified native build archive SHA256
        required: true
      binary_sha256:
        description: Verified compiled executable SHA256
        required: true
      fixture_sha256:
        description: Verified native store fixture SHA256
        required: true
jobs:
  mac-package:
    runs-on: airs-macos-arm64
    timeout-minutes: 60
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          path: runtime
          persist-credentials: false
      - name: Sign exact native build and test built-in MCP with disposable identity
        shell: bash
        env:
          AIRS_RUNTIME_SOURCE: ${{ inputs.source_ref }}
          AIRS_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          AIRS_BINARY_SHA256: ${{ inputs.binary_sha256 }}
          AIRS_FIXTURE_SHA256: ${{ inputs.fixture_sha256 }}
        run: bash scripts/airs_forgejo_mcp_release.sh
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always()
        with:
          name: airs-mcp-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/airs-mcp-release/evidence/*.json
            ${{ runner.temp }}/airs-mcp-release/evidence/SIGNING-*.log
            ${{ runner.temp }}/airs-mcp-release/mac-release/*.tar.gz
            ${{ runner.temp }}/airs-mcp-release/signed.zip
