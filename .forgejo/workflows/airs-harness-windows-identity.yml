name: AIRS Harness Windows credential identity
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source revision
        default: integrate/codex-0.154-candidate
        required: true
jobs:
  windows-identity:
    runs-on: airs-windows-x64
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: https://github.com/dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - uses: https://github.com/taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            codex-rs/target
          key: airs-identity-windows-v1-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: airs-identity-windows-v1-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Test Windows identity without building a distribution
        shell: pwsh
        run: |
          just test -p codex-airs-identity -p codex-keyring-store --locked 2>&1 | Tee-Object -FilePath windows-identity.log
          exit $LASTEXITCODE
      - name: Build Windows native credential fixture
        working-directory: codex-rs
        run: cargo build --locked -p codex-airs-identity --example store_acceptance
      - name: Verify Windows Credential Manager across separate processes
        run: python scripts/validate_native_credentials.py --binary codex-rs/target/debug/examples/store_acceptance.exe --output windows-native-store.json
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always()
        with:
          name: airs-harness-windows-identity-tests
          path: |
            windows-identity.log
            windows-native-store.json
