name: Prisma AIRS Harness preserved macOS CLI Keychain diagnostic
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run containing the preserved Apple Silicon executable
        required: true
      source_commit:
        description: Exact 40-character compiled runtime commit
        required: true
      binary_sha256:
        description: Independently verified preserved executable SHA-256
        required: true
      artifact_id:
        description: Exact artifact ID for attempt-qualified builds; omit for legacy fixed-name artifacts
        required: false
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      AIRS_DIAGNOSTIC_BUILD_RUN: ${{ inputs.build_run }}
      AIRS_DIAGNOSTIC_SOURCE: ${{ inputs.source_commit }}
      AIRS_DIAGNOSTIC_BINARY_SHA256: ${{ inputs.binary_sha256 }}
      AIRS_DIAGNOSTIC_ARTIFACT_ID: ${{ inputs.artifact_id }}
    steps:
      - name: Require Apple Silicon and initialize nonrelease evidence
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/airs-keychain-evidence"
          echo '{"passed":false,"release_ready":false,"published":false,"owner_device_tested":false,"phase":"prerequisites"}' > "$RUNNER_TEMP/airs-keychain-evidence/diagnostic.json"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Install local fixture prerequisite
        run: brew install ripgrep
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.artifact_id == ''
        with:
          name: airs-harness-darwin-arm64-unvalidated-executables
          path: ${{ runner.temp }}/compiled
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.artifact_id != ''
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/compiled
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Verify preserved bytes and test actual CLI Keychain lifecycle
        timeout-minutes: 8
        run: |
          python3 scripts/validate_macos_artifact_keychain.py --archive "$RUNNER_TEMP/compiled/unvalidated-macos-executables.tar.gz" --source-commit "$AIRS_DIAGNOSTIC_SOURCE" --binary-sha256 "$AIRS_DIAGNOSTIC_BINARY_SHA256" --build-run "$AIRS_DIAGNOSTIC_BUILD_RUN" --artifact-id "$AIRS_DIAGNOSTIC_ARTIFACT_ID" --receipt "$RUNNER_TEMP/airs-keychain-evidence/diagnostic.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: airs-harness-darwin-arm64-cli-keychain-diagnostic
          path: ${{ runner.temp }}/airs-keychain-evidence/diagnostic.json
          retention-days: 30
