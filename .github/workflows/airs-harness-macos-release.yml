name: Prisma AIRS Harness macOS release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airs-harness-macos-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      AIRS_RELEASE_TARGET: ${{ matrix.target }}
      AIRS_RELEASE_SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22.23.2
      - name: Native prerequisites and runner identity
        run: |
          brew install cmake pkgconf ripgrep
          rustc -vV
          sw_vers
          df -h .
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$AIRS_RELEASE_TARGET"
          mkdir -p "$RUNNER_TEMP/airs-evidence"
      - name: Build optimized native agent and Keychain fixture
        working-directory: codex-rs
        run: |
          cargo build --locked --release -p codex-cli --bin airs-harness
          cargo build --locked --release -p codex-airs-identity --example store_acceptance
          cargo metadata --locked --filter-platform "$AIRS_RELEASE_TARGET" --format-version 1 > "$RUNNER_TEMP/airs-metadata.json"
      - name: Prepare and verify macOS executable
        run: |
          cp codex-rs/target/release/airs-harness "$RUNNER_TEMP/airs-harness"
          strip -S "$RUNNER_TEMP/airs-harness"
          codesign --force --sign - "$RUNNER_TEMP/airs-harness"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/airs-harness"
          otool -L "$RUNNER_TEMP/airs-harness" | tee "$RUNNER_TEMP/airs-evidence/libraries.log"
          "$RUNNER_TEMP/airs-harness" --version
      - name: Native execution, sandbox and Keychain acceptance
        run: |
          AIRS_HARNESS_BIN="$RUNNER_TEMP/airs-harness" python3 -m unittest discover -s scripts -p 'test_airs_harness*.py' -v > "$RUNNER_TEMP/airs-evidence/native-tests.log" 2>&1
          python3 scripts/validate_native_credentials.py --binary codex-rs/target/release/examples/store_acceptance --output "$RUNNER_TEMP/airs-evidence/keychain.json"
          python3 scripts/record_airs_macos_validation.py --binary "$RUNNER_TEMP/airs-harness" --evidence "$RUNNER_TEMP/airs-evidence" --target "$AIRS_RELEASE_TARGET"
      - name: Package native release and npm candidate
        run: |
          python3 scripts/package_airs_harness.py --binary "$RUNNER_TEMP/airs-harness" --metadata "$RUNNER_TEMP/airs-metadata.json" --target "$AIRS_RELEASE_TARGET" --validation "$RUNNER_TEMP/airs-evidence/VALIDATION.json" --profile 'release; opt-level=3; lto=false; codegen-units=16; debug=0' --binary-processing 'strip -S; codesign --force --sign -' --output-directory "$RUNNER_TEMP/airs-package"
          tar -xzf "$RUNNER_TEMP/airs-package/airs-harness-0.1.0-alpha.8-$AIRS_RELEASE_SUFFIX.tar.gz" -C "$RUNNER_TEMP/airs-package"
          python3 scripts/verify_airs_release.py --directory "$RUNNER_TEMP/airs-package" --receipt "$RUNNER_TEMP/airs-evidence/native-integrity.json"
          python3 scripts/package_airs_npm.py --release-directory "$RUNNER_TEMP/airs-package/airs-harness-0.1.0-alpha.8-$AIRS_RELEASE_SUFFIX" --output-directory "$RUNNER_TEMP/airs-npm" --registry https://npm.cdot.io
          python3 scripts/validate_airs_npm.py --packages "$RUNNER_TEMP/airs-npm" --prefix "$RUNNER_TEMP/airs-npm-install" > "$RUNNER_TEMP/airs-evidence/npm-install.json"
          AIRS_HARNESS_BIN="$RUNNER_TEMP/airs-npm-install/bin/airs-harness" python3 -m unittest discover -s scripts -p test_airs_harness.py -v > "$RUNNER_TEMP/airs-evidence/npm-tests.log" 2>&1
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: success()
        with:
          name: airs-harness-${{ matrix.suffix }}
          path: |
            ${{ runner.temp }}/airs-package/*.tar.gz
            ${{ runner.temp }}/airs-package/*.sha256
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: airs-harness-${{ matrix.suffix }}-evidence
          path: ${{ runner.temp }}/airs-evidence/
          if-no-files-found: warn
          retention-days: 30
