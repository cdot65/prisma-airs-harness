name: Prisma AIRS Harness macOS private artifact acceptance
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted Apple Silicon acceptance runner (no compilation)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
        required: true
      packaging:
        description: Private npm package layout to validate
        type: choice
        default: legacy
        options:
          - legacy
          - scoped-bundled
        required: true
      npm_version:
        description: Exact npm consumer version
        type: choice
        default: '10.9.8'
        options:
          - '10.9.8'
          - '12.0.2'
        required: true
      build_run:
        description: Run containing the compiled Apple Silicon executable artifact
        required: true
      source_ref:
        description: Exact 40-character compiled runtime source commit
        required: true
      artifact_id:
        description: Immutable executable artifact ID from the compilation run
        required: true
      archive_sha256:
        description: Independently verified inner executable archive SHA-256
        required: true
      binary_sha256:
        description: Independently verified airs-harness executable SHA-256
        required: true
      fixture_sha256:
        description: Independently verified store_acceptance executable SHA-256
        required: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      AIRS_ACCEPTANCE_RUNNER: ${{ inputs.runner }}
      AIRS_ACCEPTANCE_PACKAGING: ${{ inputs.packaging }}
      AIRS_ACCEPTANCE_NPM: ${{ inputs.npm_version }}
      AIRS_COMPILATION_RUN: ${{ inputs.build_run }}
      AIRS_SELECTED_ARTIFACT: ${{ inputs.artifact_id }}
      AIRS_RUNTIME_SOURCE: ${{ inputs.source_ref }}
      AIRS_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      AIRS_BINARY_SHA256: ${{ inputs.binary_sha256 }}
      AIRS_FIXTURE_SHA256: ${{ inputs.fixture_sha256 }}
      AIRS_RELEASE_TARGET: aarch64-apple-darwin
      AIRS_RELEASE_SUFFIX: darwin-arm64
    steps:
      - name: Require Apple Silicon and initialize nonrelease evidence
        run: |
          test "$(uname -m)" = arm64
          test "$RUNNER_ARCH" = ARM64
          mkdir -p "$RUNNER_TEMP/airs-evidence"
          python3 - <<'HOST'
          import json, os, platform
          from pathlib import Path
          host = {'selected_runner': os.environ['AIRS_ACCEPTANCE_RUNNER'], 'machine': platform.machine(), 'macos_version': platform.mac_ver()[0], 'owner_device': False}
          (Path(os.environ['RUNNER_TEMP']) / 'airs-evidence/acceptance-host.json').write_text(json.dumps(host, indent=2) + '\n')
          HOST
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check out immutable runtime source for package provenance
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_ref }}
          path: runtime
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Select exact npm consumer without changing the native artifact
        run: |
          case "$AIRS_ACCEPTANCE_NPM" in
            10.9.8) test "$(npm --version)" = 10.9.8 ;;
            12.0.2)
              npm install --prefix "$RUNNER_TEMP/airs-npm-tool" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org npm@12.0.2
              echo "$RUNNER_TEMP/airs-npm-tool/node_modules/.bin" >> "$GITHUB_PATH"
              ;;
            *) exit 1 ;;
          esac
      - name: Check acceptance tooling before opening the preserved artifact
        run: |
          python3 -m compileall -q scripts
          node --test npm/airs-harness/*.test.js > "$RUNNER_TEMP/airs-evidence/launcher-tests.log" 2>&1
          python3 -m unittest discover -s scripts -p 'test_airs_bundle*.py' -v > "$RUNNER_TEMP/airs-evidence/bundle-tests.log" 2>&1
          python3 -m unittest discover -s scripts -p test_airs_npm_registry.py -v > "$RUNNER_TEMP/airs-evidence/npm-registry-tests.log" 2>&1
          python3 -m unittest discover -s scripts -p test_airs_macos_artifact.py -v > "$RUNNER_TEMP/airs-evidence/artifact-tests.log" 2>&1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/download
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Validate preserved Apple Silicon executables without compiling
        id: restore
        run: |
          python3 scripts/airs_macos_artifact.py restore --archive "$RUNNER_TEMP/download/unvalidated-macos-executables.tar.gz" --directory "$RUNNER_TEMP/compiled" --source-commit "$AIRS_RUNTIME_SOURCE" --archive-sha256 "$AIRS_ARCHIVE_SHA256" --binary-sha256 "$AIRS_BINARY_SHA256" --fixture-sha256 "$AIRS_FIXTURE_SHA256"
          test "$(git -C runtime rev-parse HEAD)" = "$AIRS_RUNTIME_SOURCE"
          cp "$RUNNER_TEMP/compiled/ARTIFACT-VERIFIED.json" "$RUNNER_TEMP/airs-evidence/"
          git rev-parse HEAD > "$RUNNER_TEMP/airs-evidence/test-tooling-source.txt"
          python3 - <<'RECEIPT'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          receipt = json.loads((directory / 'compiled/ARTIFACT-VERIFIED.json').read_text())
          receipt.update(artifact_id=os.environ['AIRS_SELECTED_ARTIFACT'], compilation_run=os.environ['AIRS_COMPILATION_RUN'], acceptance_run=os.environ['GITHUB_RUN_ID'], acceptance_attempt=os.environ['GITHUB_RUN_ATTEMPT'], validation_tooling_source=os.environ['GITHUB_SHA'])
          (directory / 'airs-evidence/artifact-selection.json').write_text(json.dumps(receipt, indent=2) + '\n')
          RECEIPT
          for binary in airs-harness store_acceptance; do
            test "$(lipo -archs "$RUNNER_TEMP/compiled/$binary")" = arm64
            codesign --verify --strict --verbose=2 "$RUNNER_TEMP/compiled/$binary"
            codesign -dvv "$RUNNER_TEMP/compiled/$binary" 2> "$RUNNER_TEMP/airs-evidence/$binary-signing.log"
            test "$(sed -n 's/^Signature=//p' "$RUNNER_TEMP/airs-evidence/$binary-signing.log")" = adhoc
          done
          otool -L "$RUNNER_TEMP/compiled/airs-harness" | tee "$RUNNER_TEMP/airs-evidence/libraries.log"
          brew install ripgrep
      - name: Native CLI Keychain acceptance
        run: python3 scripts/validate_airs_macos_keychain.py --binary "$RUNNER_TEMP/compiled/airs-harness" --receipt "$RUNNER_TEMP/airs-evidence/native-cli-keychain.json"
      - name: Broad preserved runtime acceptance
        run: |
          AIRS_HARNESS_TEST_EVIDENCE="$RUNNER_TEMP/airs-evidence/fixtures" AIRS_HARNESS_BIN="$RUNNER_TEMP/compiled/airs-harness" python3 -m unittest discover -s scripts -p 'test_airs_harness*.py' -v > "$RUNNER_TEMP/airs-evidence/native-tests.log" 2>&1
      - name: Native Keychain acceptance
        run: |
          python3 scripts/validate_native_credentials.py --binary "$RUNNER_TEMP/compiled/store_acceptance" --output "$RUNNER_TEMP/airs-evidence/keychain.json"
          python3 scripts/record_airs_macos_validation.py --binary "$RUNNER_TEMP/compiled/airs-harness" --evidence "$RUNNER_TEMP/airs-evidence" --target "$AIRS_RELEASE_TARGET" --source-directory runtime --build-run "$AIRS_COMPILATION_RUN"
      - name: Restore dependency sources for license inventory without compiling
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: airs-macos-sources-v1-${{ runner.arch }}-${{ hashFiles('runtime/codex-rs/Cargo.lock', 'runtime/codex-rs/rust-toolchain.toml') }}
          restore-keys: airs-macos-sources-v1-${{ runner.arch }}-
      - name: Resolve locked dependency metadata without compiling
        working-directory: runtime/codex-rs
        run: cargo metadata --locked --filter-platform "$AIRS_RELEASE_TARGET" --format-version 1 > "$RUNNER_TEMP/airs-metadata.json"
      - name: Package preserved private native and npm candidate
        env:
          AIRS_BUILD_COMMAND: ${{ steps.restore.outputs.build_command }}
          AIRS_BUILD_PROFILE: ${{ steps.restore.outputs.profile }}
        run: |
          test "$(npm --version)" = "$AIRS_ACCEPTANCE_NPM"
          node --version > "$RUNNER_TEMP/airs-evidence/node-version.txt"
          npm --version > "$RUNNER_TEMP/airs-evidence/npm-version.txt"
          printf '%s\n' "$AIRS_ACCEPTANCE_PACKAGING" > "$RUNNER_TEMP/airs-evidence/npm-layout.txt"
          AIRS_PACKAGE_OPTIONS=()
          case "$AIRS_ACCEPTANCE_PACKAGING" in
            legacy) AIRS_LAUNCHER_PACKAGE=airs-harness; AIRS_PACKAGE_REGISTRY=https://npm.cdot.io ;;
            scoped-bundled)
              AIRS_LAUNCHER_PACKAGE=@cdot65/prisma-airs-harness
              AIRS_PACKAGE_REGISTRY=https://npm.pkg.github.com
              AIRS_PACKAGE_OPTIONS=(--scoped --bundle-cli)
              ;;
            *) exit 1 ;;
          esac
          python3 scripts/package_airs_harness.py --source-directory runtime --binary "$RUNNER_TEMP/compiled/airs-harness" --metadata "$RUNNER_TEMP/airs-metadata.json" --target "$AIRS_RELEASE_TARGET" --unvalidated-candidate --build-command "$AIRS_BUILD_COMMAND" --profile "$AIRS_BUILD_PROFILE" --binary-processing 'strip -S; codesign --force --sign -' --output-directory "$RUNNER_TEMP/airs-package"
          AIRS_PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('npm/airs-harness/package.json')).version")"
          tar -xzf "$RUNNER_TEMP/airs-package/airs-harness-$AIRS_PACKAGE_VERSION-$AIRS_RELEASE_SUFFIX.tar.gz" -C "$RUNNER_TEMP/airs-package"
          python3 scripts/verify_airs_release.py --directory "$RUNNER_TEMP/airs-package" --receipt "$RUNNER_TEMP/airs-evidence/native-integrity.json"
          python3 scripts/package_airs_npm.py --release-directory "$RUNNER_TEMP/airs-package/airs-harness-$AIRS_PACKAGE_VERSION-$AIRS_RELEASE_SUFFIX" --output-directory "$RUNNER_TEMP/airs-npm" --registry "$AIRS_PACKAGE_REGISTRY" "${AIRS_PACKAGE_OPTIONS[@]}"
          python3 scripts/validate_airs_npm.py --packages "$RUNNER_TEMP/airs-npm" --prefix "$RUNNER_TEMP/airs-npm-install" > "$RUNNER_TEMP/airs-evidence/npm-install.json"
          python3 scripts/validate_prisma_cli.py --launcher "$RUNNER_TEMP/airs-npm-install/lib/node_modules/$AIRS_LAUNCHER_PACKAGE/bin/airs-harness.js" --receipt "$RUNNER_TEMP/airs-evidence/prisma-cli.json"
          AIRS_HARNESS_TEST_EVIDENCE="$RUNNER_TEMP/airs-evidence/npm-fixtures" AIRS_MANAGED_CLI_ACCEPTANCE=1 AIRS_HARNESS_BIN="$RUNNER_TEMP/airs-npm-install/bin/airs-harness" python3 -m unittest discover -s scripts -p test_airs_harness.py -v > "$RUNNER_TEMP/airs-evidence/npm-tests.log" 2>&1
      - name: Keychain acceptance through the exact installed npm candidate
        run: python3 scripts/validate_airs_macos_keychain.py --binary "$RUNNER_TEMP/airs-npm-install/bin/airs-harness" --receipt "$RUNNER_TEMP/airs-evidence/cli-keychain.json"
      - name: Preserve npm installation diagnostics on success or failure
        if: always()
        run: |
          python3 - <<'DIAGNOSTICS'
          import os, shutil
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          destination = temporary / 'airs-evidence/npm-diagnostics'
          destination.mkdir(parents=True, exist_ok=True)
          for name in ('npm-install.log', 'INSTALL-NETWORK.json', 'INSTALL-VERIFICATION.json'):
              source = temporary / 'airs-npm-install' / name
              if source.is_file() and not source.is_symlink() and source.stat().st_size <= 5 * 1024 * 1024:
                  shutil.copyfile(source, destination / name)
          DIAGNOSTICS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: airs-harness-darwin-arm64-private-candidate-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/airs-package/*.tar.gz
            ${{ runner.temp }}/airs-package/*.sha256
            ${{ runner.temp }}/airs-npm/tarballs/*.tgz
            ${{ runner.temp }}/airs-npm/NPM-PACKAGES.json
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: airs-harness-darwin-arm64-acceptance-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airs-evidence/
          retention-days: 30
