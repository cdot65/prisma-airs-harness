name: Prisma AIRS Harness npm launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'npm/airs-harness/**'
      - 'scripts/package_airs_npm.py'
      - 'scripts/validate_prisma_cli.py'
      - '.github/workflows/airs-harness-npm-check.yml'
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22.23.2
      - run: node --test npm/airs-harness/*.test.js
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: npm ci --prefix npm/airs-harness --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org
      - run: python scripts/validate_prisma_cli.py
