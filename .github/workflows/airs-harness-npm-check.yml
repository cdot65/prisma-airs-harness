name: Prisma AIRS Harness npm launcher
on:
  workflow_dispatch:
    inputs:
      refresh_bazel_lock:
        description: Refresh the dependency lock on a GNU Linux host and upload it for review
        type: boolean
        default: false
  pull_request:
    paths:
      - 'npm/airs-harness/**'
      - 'scripts/*airs*npm*.py'
      - 'scripts/*airs*bundle*.py'
      - 'scripts/test_package_airs_harness.py'
      - 'scripts/package_airs_harness.py'
      - 'scripts/*airs_review*.py'
      - 'scripts/*airs_registry_install.py'
      - 'scripts/*airs_package_access.py'
      - 'scripts/format.py'
      - 'scripts/test_format.py'
      - 'scripts/*airs_signed_macos_artifact.py'
      - '.github/workflows/airs-harness-macos-signed.yml'
      - '.github/workflows/airs-harness-review-publish.yml'
      - '.github/workflows/airs-harness-registry-acceptance.yml'
      - 'scripts/validate_prisma_cli.py'
      - '.github/workflows/airs-harness-npm-check.yml'
      - '.github/workflows/airs-harness-identity.yml'
      - '.github/workflows/airs-harness-macos-release.yml'
  push:
    branches: [main]
    paths:
      - 'npm/airs-harness/**'
      - 'scripts/*airs*npm*.py'
      - 'scripts/*airs*bundle*.py'
      - 'scripts/test_package_airs_harness.py'
      - 'scripts/package_airs_harness.py'
      - 'scripts/*airs_review*.py'
      - 'scripts/*airs_registry_install.py'
      - 'scripts/*airs_package_access.py'
      - 'scripts/format.py'
      - 'scripts/test_format.py'
      - 'scripts/*airs_signed_macos_artifact.py'
      - '.github/workflows/airs-harness-macos-signed.yml'
      - '.github/workflows/airs-harness-review-publish.yml'
      - '.github/workflows/airs-harness-registry-acceptance.yml'
      - 'scripts/validate_prisma_cli.py'
      - '.github/workflows/airs-harness-npm-check.yml'
      - '.github/workflows/airs-harness-identity.yml'
      - '.github/workflows/airs-harness-macos-release.yml'
permissions:
  contents: read
concurrency:
  group: airs-harness-npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependency-lock:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_bazel_lock }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install checksum-pinned Bazelisk
        run: |
          curl --fail --location --retry 3 https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-linux-amd64 --output "$RUNNER_TEMP/bazel"
          echo "22e7d3a188699982f661cf4687137ee52d1f24fec1ec893d91a6c4d791a75de8  $RUNNER_TEMP/bazel" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Refresh and verify dependency lock
        run: |
          bazel mod deps --lockfile_mode=update
          bazel mod deps --lockfile_mode=error
          git rev-parse HEAD > dependency-lock-source.txt
          sha256sum codex-rs/Cargo.lock MODULE.bazel.lock > dependency-lock-sha256.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: airs-harness-dependency-lock
          path: |
            MODULE.bazel.lock
            dependency-lock-source.txt
            dependency-lock-sha256.txt
          if-no-files-found: error
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint binary
        run: |
          python3 - <<'PYTHON'
          import hashlib, io, os, platform, tarfile, urllib.request
          from pathlib import Path
          targets = {
              ('Linux', 'x86_64'): ('linux_amd64', '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'),
              ('Darwin', 'arm64'): ('darwin_arm64', 'aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f'),
          }
          target, digest = targets[(platform.system(), platform.machine())]
          url = 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_' + target + '.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive = response.read(32 * 1024 * 1024)
          if hashlib.sha256(archive).hexdigest() != digest:
              raise SystemExit('actionlint archive checksum mismatch')
          directory = Path(os.environ['RUNNER_TEMP'])/'actionlint-pinned'
          directory.mkdir()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              member = bundle.getmember('actionlint')
              if not member.isfile() or member.size > 32 * 1024 * 1024:
                  raise SystemExit('Invalid actionlint executable member')
              executable = directory/'actionlint'
              executable.write_bytes(bundle.extractfile(member).read())
              executable.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(directory) + '\n')
          PYTHON
      - name: Validate owned cache and PR workflow semantics
        run: actionlint -shellcheck= -pyflakes= .github/workflows/airs-harness-identity.yml .github/workflows/airs-harness-macos-release.yml .github/workflows/airs-harness-npm-check.yml .github/workflows/airs-harness-macos-signed.yml .github/workflows/airs-harness-review-publish.yml .github/workflows/airs-harness-registry-acceptance.yml
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm/airs-harness/package-lock.json
      - run: node --test npm/airs-harness/*.test.js
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: npm ci --prefix npm/airs-harness --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org
      - run: python scripts/validate_prisma_cli.py
      - run: python -m unittest discover -s scripts -p 'test_airs_bundle*.py' -v
      - run: python -m unittest discover -s scripts -p test_airs_npm_registry.py -v
      - run: python -m unittest discover -s scripts -p test_package_airs_harness.py -v
      - run: python -m unittest discover -s scripts -p test_airs_review_release.py -v
      - run: python -m unittest discover -s scripts -p test_airs_signed_macos_artifact.py -v
      - run: python -m unittest discover -s scripts -p 'test_plan_airs_review*.py' -v
      - run: python -m unittest discover -s scripts -p test_publish_airs_review.py -v
      - run: python -m unittest discover -s scripts -p test_airs_package_access.py -v
      - run: python -m unittest discover -s scripts -p test_restore_airs_review_stage.py -v
      - run: python -m unittest discover -s scripts -p test_validate_airs_registry_install.py -v
      - run: python -m unittest discover -s scripts -p test_format.py -v
