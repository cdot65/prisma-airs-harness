name: Prisma AIRS Harness npm launcher
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'npm/airs-harness/**'
      - 'scripts/*airs*npm*.py'
      - 'scripts/*airs*bundle*.py'
      - 'scripts/test_package_airs_harness.py'
      - 'scripts/package_airs_harness.py'
      - 'scripts/*airs_review_release.py'
      - 'scripts/*airs_signed_macos_artifact.py'
      - '.github/workflows/airs-harness-macos-signed.yml'
      - 'scripts/validate_prisma_cli.py'
      - '.github/workflows/airs-harness-npm-check.yml'
      - '.github/workflows/airs-harness-identity.yml'
      - '.github/workflows/airs-harness-macos-release.yml'
  push:
    branches: [main]
    paths:
      - 'npm/airs-harness/**'
      - 'scripts/*airs*npm*.py'
      - 'scripts/*airs*bundle*.py'
      - 'scripts/test_package_airs_harness.py'
      - 'scripts/package_airs_harness.py'
      - 'scripts/*airs_review_release.py'
      - 'scripts/*airs_signed_macos_artifact.py'
      - '.github/workflows/airs-harness-macos-signed.yml'
      - 'scripts/validate_prisma_cli.py'
      - '.github/workflows/airs-harness-npm-check.yml'
      - '.github/workflows/airs-harness-identity.yml'
      - '.github/workflows/airs-harness-macos-release.yml'
permissions:
  contents: read
concurrency:
  group: airs-harness-npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: actionlint@1.7.12
      - name: Validate owned cache and PR workflow semantics
        run: actionlint -shellcheck= -pyflakes= .github/workflows/airs-harness-identity.yml .github/workflows/airs-harness-macos-release.yml .github/workflows/airs-harness-npm-check.yml .github/workflows/airs-harness-macos-signed.yml
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm/airs-harness/package-lock.json
      - run: node --test npm/airs-harness/*.test.js
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: npm ci --prefix npm/airs-harness --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org
      - run: python scripts/validate_prisma_cli.py
      - run: python -m unittest discover -s scripts -p 'test_airs_bundle*.py' -v
      - run: python -m unittest discover -s scripts -p test_airs_npm_registry.py -v
      - run: python -m unittest discover -s scripts -p test_package_airs_harness.py -v
      - run: python -m unittest discover -s scripts -p test_airs_review_release.py -v
      - run: python -m unittest discover -s scripts -p test_airs_signed_macos_artifact.py -v
