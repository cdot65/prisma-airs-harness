name: AIRS Terminal deployment connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airs-terminal-deployment-check
  cancel-in-progress: false
jobs:
  public-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check TLS connectivity and anonymous rejection without credentials
        run: python3 scripts/check_airs_endpoints.py --output "$RUNNER_TEMP/airs-endpoints.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: airs-terminal-public-endpoints
          path: ${{ runner.temp }}/airs-endpoints.json
          retention-days: 30
          if-no-files-found: error
