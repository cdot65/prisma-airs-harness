[package]
edition.workspace = true
license.workspace = true
name = "codex-airs-identity"
version.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
codex-http-client = { workspace = true }
codex-keyring-store = { workspace = true }
keyring = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
anyhow = { workspace = true }
jsonwebtoken = { workspace = true }
openidconnect = { version = "4.0.1", features = ["timing-resistant-secret-traits"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros"] }
url = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }


[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust"] }

# musl's AF_UNSPEC lookup drops a valid A answer when AAAA returns NXDOMAIN.
# Keep the host's DNS configuration and resolve the address families independently.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
reqwest = { workspace = true, features = ["hickory-dns"] }
